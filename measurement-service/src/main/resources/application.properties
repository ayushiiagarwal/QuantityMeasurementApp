spring.application.name=measurement-service
server.port=${PORT:8081}

# ── Database (schema for measurement history) ───────────────────────
spring.datasource.url={SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/microservice_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ayushi@200405}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── Eureka ────────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=false
