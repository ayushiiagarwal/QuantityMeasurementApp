spring:
  application:
    name: api-gateway

  webflux:
    cors:
      mappings:
        "[/**]":
          allowed-origin-patterns:
            - http://localhost:4200
            - "https://*.railway.app"
            - "https://qma-apigateway.up.railway.app"
            - "${FRONTEND_URL:http://localhost:4200}"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers: "*"
          allow-credentials: true

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns:
              - http://localhost:4200
              - "https://*.railway.app"
              - "https://qma-apigateway.up.railway.app"
              - "${FRONTEND_URL:http://localhost:4200}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service-auth
          uri: "${USER_SERVICE_URL:lb://user-service}"
          predicates:
            - Path=/auth/**

        - id: user-service-oauth2
          uri: "${USER_SERVICE_URL:lb://user-service}"
          predicates:
            - Path=/oauth2/**,/login/oauth2/**
          filters:
            - JwtAuthFilter

        - id: user-service-secured
          uri: "${USER_SERVICE_URL:lb://user-service}"
          predicates:
            - Path=/users/**
          filters:
            - JwtAuthFilter

        - id: measurement-service
          uri: "${MEASUREMENT_SERVICE_URL:lb://measurement-service}"
          predicates:
            - Path=/api/quantities/**
          filters:
            - JwtAuthFilter

        - id: user-service-api-docs
          uri: "${USER_SERVICE_URL:lb://user-service}"
          predicates:
            - Path=/user-service/v3/api-docs/**,/user-service/v3/api-docs
          filters:
            - RewritePath=/user-service(?<remaining>.*), $\{remaining}

        - id: measurement-service-api-docs
          uri: "${MEASUREMENT_SERVICE_URL:lb://measurement-service}"
          predicates:
            - Path=/measurement-service/v3/api-docs/**,/measurement-service/v3/api-docs
          filters:
            - RewritePath=/measurement-service(?<remaining>.*), $\{remaining}

server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: false

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Measurement Service
        url: /measurement-service/v3/api-docs
  api-docs:
    enabled: true
